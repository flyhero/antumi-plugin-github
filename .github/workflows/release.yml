name: Release plugin
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check release tag
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs'
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'))
          if (process.env.GITHUB_REF_NAME !== `v${pkg.version}` || pkg.version !== manifest.version) throw new Error('Release tag, package and manifest versions must match')
          JS
      - name: Publish ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          package_name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          flags=(--latest=true)
          if [[ "$version" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" "dist/${package_name}-${version}.zip" \
            --verify-tag --title "${package_name} ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md "${flags[@]}"
